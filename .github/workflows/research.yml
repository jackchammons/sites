name: Research pizza buzz

# Uses the Claude Code Action to find Seattle pizza openings and closings the
# RSS sweep missed, writing them to pizza/data/research.json.
#
# Deliberately NOT part of publish.yml:
#  - an agent must not sit in the deploy path; if it hangs or fails, the site
#    still publishes on its own schedule
#  - this workflow never calls deploy-pages. A Pages deploy replaces the whole
#    site, so publish.yml remains the only workflow allowed to deploy.
# Its commit to main triggers publish.yml through that workflow's push trigger,
# so a successful research run reaches the site without deploying anything here.
#
# Dormant until a credential exists. Either works:
#   CLAUDE_CODE_OAUTH_TOKEN  bills the subscription's programmatic credit pool
#                            (generate with `claude setup-token`)
#   ANTHROPIC_API_KEY        bills metered API credits (Claude Console)
# Set ONE. If both are present the API key wins the credential chain, so you
# would pay per token while the subscription allowance sat unused.
on:
  schedule:
    - cron: '47 12 * * *'   # 30 min before publish.yml, so its commit is picked up
  workflow_dispatch:

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    name: Research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skips cleanly when the secret is absent, which is the current state.
    if: ${{ github.repository_owner == 'jackchammons' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check for a credential
        id: gate
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] && [ -n "$APIKEY" ]; then
            echo "::warning::Both CLAUDE_CODE_OAUTH_TOKEN and ANTHROPIC_API_KEY are set. The API key wins the credential chain, so this run bills metered API credits and the subscription allowance goes unused. Remove one."
          fi
          if [ -n "$OAUTH" ] || [ -n "$APIKEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            [ -n "$OAUTH" ] && echo "auth=subscription" >> "$GITHUB_OUTPUT" || echo "auth=api" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY — skipping the research pass."
          fi

      # The action hides the SDK's output, so an auth or billing failure surfaces
      # only as is_error:true with no cost and no model usage. This probe turns
      # that into the actual API error before three minutes of retries.
      - name: Preflight credential check
        if: steps.gate.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            AUTH_HEADER="x-api-key: $ANTHROPIC_API_KEY"
            EXTRA=()
          else
            AUTH_HEADER="Authorization: Bearer $CLAUDE_CODE_OAUTH_TOKEN"
            EXTRA=(-H "anthropic-beta: oauth-2025-04-20")
          fi
          code=$(curl -sS -o /tmp/probe.json -w '%{http_code}'             https://api.anthropic.com/v1/messages             -H "$AUTH_HEADER"             -H "anthropic-version: 2023-06-01"             -H "content-type: application/json"             "${EXTRA[@]}"             -d '{"model":"claude-opus-5","max_tokens":64,"messages":[{"role":"user","content":"reply with OK"}]}' || echo 000)
          echo "Preflight HTTP $code (auth: ${{ steps.gate.outputs.auth }})"
          TYPE=$(python3 -c "import json;print(json.load(open('/tmp/probe.json')).get('error',{}).get('type','?'))" 2>/dev/null || echo '?')
          MSG=$(python3 -c "import json;print(json.load(open('/tmp/probe.json')).get('error',{}).get('message','?'))" 2>/dev/null || echo '?')
          case "$code" in
            200)
              echo "Credential is valid and claude-opus-5 is reachable." ;;
            401|403)
              # Definitively bad: wrong secret, revoked key, no access to the model.
              echo "::error::Credential rejected — HTTP $code, $TYPE: $MSG"
              exit 1 ;;
            *)
              # 429 and 5xx mean the credential authenticated and something
              # transient got in the way. The agent has its own retries, so a
              # probe that fails here must not fail the run.
              echo "::warning::Preflight did not get a clean 200 (HTTP $code, $TYPE: $MSG). The credential is not rejected, so continuing — the agent will retry."
              ;;
          esac

      # What actually broke the first six runs, found by turning on
      # show_full_output: the prompt named verify-research.mjs, so the agent
      # tried to run it, had no Bash tool, was denied four times, and then
      # stopped to ask a human for approval in an unattended job. Its own result
      # was is_error:false / stop_reason:end_turn -- it had already done the
      # work and written the file -- but the action failed the run for
      # exceeding the turn limit. Never mention a script the agent cannot run.
      #
      # Turn budget, measured rather than guessed. The fixed prompt produced a
      # clean pass -- is_error false, one denial instead of four -- but it took
      # 55 turns against a ceiling of 50, and the action fails the step for
      # overrunning even when the agent reports success. So: 80 turns, which is
      # headroom over both observed passes (45 and 55), and a search budget in
      # the prompt so the count stays bounded rather than scaling with how much
      # news happens to exist that day. max-turns is a ceiling, not a target --
      # a run costs the turns it actually uses.
      #
      # continue-on-error below is the other half. An overrun is a bookkeeping
      # failure, not a research failure: the file is already written. Letting
      # the step fail soft and having the next step judge the artefact means a
      # complete pass still lands. That step, not this one, is what turns the
      # run red -- a missing or stale file still fails the job.
      #
      # Crowd ratings are NOT the agent's job, and cannot be. Yelp returns 403
      # to automated fetching -- business pages and search alike -- and Google's
      # results carry no rating in the HTML. Three runs burned their whole turn
      # budget thrashing against that: 12, 28 and 30 turns, never converging.
      # That is a property of the sources, not something a prompt can fix, and
      # there is no API path either: a Yelp key was considered and ruled out.
      # Crowd ratings are therefore frozen at the values in restaurants.json.
      #
      # What the agent IS good at is editorial research: openings, closings and
      # reviews live on news sites that serve their content to anyone. The
      # broader early runs were finding real stories before they ran out of
      # turns, so that is what it does now.
      # Fingerprint taken before the agent runs so the check afterwards can tell
      # a real write from an untouched leftover. research.json is committed
      # after a good run -- the build reads it for The Buzz -- so on later runs
      # it is already present at checkout and mere existence proves nothing.
      - name: Fingerprint the previous research file
        id: before
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if [ -f pizza/data/research.json ]; then
            echo "sum=$(sha256sum pizza/data/research.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "sum=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: Research and refresh pizza data
        id: agent
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # Whichever secret exists; the empty one is ignored by the action.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 80
            --model claude-sonnet-5
            --allowedTools "WebSearch,WebFetch,Read,Write,Glob,Grep,TodoWrite"
          prompt: |
            Find Seattle pizzeria news from the last 30 days that is not already
            covered, and write it to pizza/data/research.json.

            Read pizza/data/buzz.json first to see what the automated feed sweep
            already found, so you do not repeat it. Then search for what it
            missed: new pizzerias opening, pizzerias closing, and notable
            reviews or rankings of Seattle-area pizzerias.

            Write pizza/data/research.json:

            {"updated":"<ISO8601 now>",
             "news":[{"title":"<headline as published>",
                      "url":"<https link to the article>",
                      "source":"<publication name>",
                      "published":"<ISO8601 publication date>",
                      "kind":"opening|closing|ranking|mention",
                      "mentions":[]}],
             "candidates":[{"name":"<pizzeria>","neighborhood":"<area>",
                            "style":"<style>","note":"<one sentence on why>",
                            "source":"<https URL>"}]}

            candidates are Seattle pizzerias worth adding to the ranking later --
            recent openings, or places getting real critical attention. Leave the
            array empty if you find none.

            IMPORTANT: do not run any shell command, script or validator. You
            have no Bash tool, and asking for approval stalls this job -- nobody
            is watching it. Write the file and stop. A later step in this
            workflow validates it automatically and rejects it if anything is
            wrong, so your job is to write it carefully, not to check it.

            Rules the automatic validation applies, which reject the whole file
            if any entry breaks them:
            - Every entry needs a real https URL you actually opened. Never
              invent a URL, a headline or a date.
            - published must be a real date within the last 180 days, not future.
            - kind must be exactly one of the four values above.
            - Seattle metro only. No national chains, no crime stories, no
              business-wire or real-estate items.
            - At most 12 news and 8 candidates. Omissions are free; fabrications
              are not.

            Work within a budget: make at most 15 web searches in total. When
            you reach that, write the file with whatever you have and stop. A
            short honest file is a good result; there is no requirement to fill
            the caps, and a day with little Seattle pizza news should produce a
            short file.

            Do not attempt crowd ratings, star scores or review counts. Those
            sources block automated reads and there is no API path; the stored
            figures are frozen by design. Write only pizza/data/research.json,
            never touch pillar scores, and run nothing.

      # This step, not the agent step, decides whether the run failed. An
      # overrun turn ceiling leaves outcome == failure on a pass that already
      # wrote its file, and that should not lose the work. An agent that wrote
      # nothing should still turn the job red -- and would not otherwise, since
      # verify-research.mjs treats a missing file as "no research run yet" and
      # exits 0, which is correct for the dormant case but a false green here.
      - name: Check the agent actually wrote something
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if [ ! -f pizza/data/research.json ]; then
            echo "::error::The agent wrote no pizza/data/research.json." \
                 "Agent step outcome: ${{ steps.agent.outcome }}."
            exit 1
          fi
          now=$(sha256sum pizza/data/research.json | cut -d' ' -f1)
          if [ "$now" = "${{ steps.before.outputs.sum }}" ]; then
            echo "::error::pizza/data/research.json is byte-identical to the" \
                 "checked-out copy, so this run wrote nothing." \
                 "Agent step outcome: ${{ steps.agent.outcome }}."
            exit 1
          fi
          if [ "${{ steps.agent.outcome }}" != "success" ]; then
            echo "::warning::The agent step reported failure but left a fresh" \
                 "research.json. Usually the turn ceiling, hit after the write." \
                 "Validating the file on its merits."
          fi

      - name: Validate the agent's output
        if: steps.gate.outputs.enabled == 'true'
        run: node pizza/scripts/verify-research.mjs

      # Only runs once validation passes, so nothing unchecked reaches the
      # dataset. Touches crowd figures and closure flags only.
      - name: Apply researched ratings and closures
        if: steps.gate.outputs.enabled == 'true'
        run: node pizza/scripts/apply-research.mjs

      # Pushes with an explicit token rather than the credential checkout
      # persists. The Claude action mints its own GitHub App token and revokes
      # it in its cleanup, inside the agent step, which leaves the persisted
      # header pointing at a dead token by the time this step runs -- the push
      # came back "Invalid username or token" on an otherwise clean pass.
      # publish.yml gets away with a bare `git push` only because it never runs
      # the action. GITHUB_TOKEN is job-scoped and outlives the app token.
      #
      # Rebase before pushing: publish.yml commits to main on its own schedule
      # and the two can overlap. --autostash is not needed, the tree is clean
      # after the commit, but a rejected push should retry rather than fail a
      # run that did real work.
      - name: Commit research
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATHS="pizza/data/research.json pizza/data/restaurants.json"
          if [ -n "$(git status --porcelain -- $PATHS)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $PATHS
            git commit -m "chore(data): research pass $(date -u +%Y-%m-%d)"
            REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            pushed=no
            for attempt in 1 2 3; do
              [ "$attempt" = 1 ] || sleep $(( attempt * 5 ))
              if ! git fetch "$REMOTE" main; then
                echo "fetch failed on attempt $attempt"; continue
              fi
              if ! git rebase FETCH_HEAD; then
                git rebase --abort || true
                echo "rebase onto main failed on attempt $attempt"; continue
              fi
              if git push "$REMOTE" HEAD:main; then
                pushed=yes
                echo "pushed on attempt $attempt"
                break
              fi
              echo "push rejected on attempt $attempt"
            done
            if [ "$pushed" != yes ]; then
              echo "::error::Could not push the research commit after 3 attempts."
              exit 1
            fi
          else
            echo "No new research to record."
          fi
