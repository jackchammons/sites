name: Research pizza buzz

# Uses the Claude Code Action to find Seattle pizza openings and closings the
# RSS sweep missed, writing them to pizza/data/research.json.
#
# Deliberately NOT part of publish.yml:
#  - an agent must not sit in the deploy path; if it hangs or fails, the site
#    still publishes on its own schedule
#  - this workflow never calls deploy-pages. A Pages deploy replaces the whole
#    site, so publish.yml remains the only workflow allowed to deploy.
# Its commit to main triggers publish.yml through that workflow's push trigger,
# so a successful research run reaches the site without deploying anything here.
#
# Dormant until CLAUDE_CODE_OAUTH_TOKEN exists. That token bills the
# subscription's programmatic credit pool; do NOT also set ANTHROPIC_API_KEY,
# which takes precedence in the credential chain and bills API credits instead.
on:
  schedule:
    - cron: '47 12 * * *'   # 30 min before publish.yml, so its commit is picked up
  workflow_dispatch:

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    name: Research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skips cleanly when the secret is absent, which is the current state.
    if: ${{ github.repository_owner == 'jackchammons' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check for a subscription token
        id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN not set — skipping the research pass."
          fi

      # --max-turns is a cost control, not a style choice: an unbounded agentic
      # loop is what drains a monthly credit pool.
      - name: Research recent Seattle pizza news
        if: steps.gate.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 12
            --model claude-opus-5
            --allowedTools "WebSearch,WebFetch,Read,Write"
          prompt: |
            Find Seattle pizzeria news from the last 30 days that is NOT already
            in pizza/data/buzz.json — specifically openings, closings, and
            notable reviews of Seattle-area pizzerias.

            Read pizza/data/buzz.json first to see what is already covered and to
            follow its item shape. Then write pizza/data/research.json:

            {"updated":"<ISO8601>","items":[{
              "title":"<headline as published>",
              "url":"<https link to the original article>",
              "source":"<publication name>",
              "published":"<ISO8601 date of publication>",
              "kind":"opening|closing|ranking|mention",
              "mentions":["<restaurant id from data/restaurants.json, if named>"]
            }]}

            Rules, all enforced by pizza/scripts/verify-research.mjs:
            - Every item needs a real https URL you actually found. Never invent
              a URL, a headline, or a date. If you are unsure a link is real,
              leave the item out.
            - published must be a real publication date within the last 180 days
              and not in the future.
            - kind must be exactly one of the four values above.
            - mentions may only contain ids that exist in data/restaurants.json.
            - At most 20 items. Fewer good ones is better than padding.
            - Seattle metro only. No national chains, no crime stories, no
              business-wire or real-estate items.

            Write only pizza/data/research.json. Do not modify any other file.
            If you find nothing new, write {"updated":"<ISO8601>","items":[]}.

      - name: Validate the agent's output
        if: steps.gate.outputs.enabled == 'true'
        run: node pizza/scripts/verify-research.mjs

      - name: Commit research
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if [ -n "$(git status --porcelain -- pizza/data/research.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- pizza/data/research.json
            git commit -m "chore(data): research pass $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new research to record."
          fi
