name: CI

# The one definition of the checks: unit tests, the shell scripts, the dataset
# lint, and build-all, which builds and verifies every site in
# sites.config.json and renders the landing page. Nothing is listed by site, so
# a new site or test file is covered without an edit here.
#
# Runs on every branch push and pull request, and publish.yml calls it before
# it builds, so main is held to the same checks on every trigger. Nothing here
# deploys: publish.yml is the only workflow allowed to. No snapshot is written
# (SNAPSHOT is unset), and the last step fails if the build changed a tracked
# file.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA to check. Empty means the commit that triggered the run.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Test, lint, build, verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests
        run: node --test */test/*.test.mjs
      # commit-data.sh pushes to main from two workflows; its test runs it
      # against scratch repositories, so nothing here needs a token or network.
      - name: Shell scripts
        run: |
          bash -n scripts/commit-data.sh
          bash scripts/test/commit-data.test.sh
      - name: Lint the dataset
        run: node pizza/scripts/check-dataset.mjs
      # No flags: the orchestrator refuses --only and --skip under CI, and
      # every registered site builds without anything this job has to install.
      - name: Build and verify every site
        run: node scripts/build-all.mjs
      - name: The build must not touch tracked files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build modified tracked files:"; git status --porcelain; exit 1
          fi
