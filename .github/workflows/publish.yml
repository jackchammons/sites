name: Publish sites

# Builds every site in sites.config.json and deploys dist/ to GitHub Pages.
#
# One workflow deploys everything on purpose: a Pages deployment replaces the
# whole site, so separate per-site workflows would delete each other's output.
# The cron therefore runs at the fastest cadence any single site needs.
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours, offset from :00 (GitHub delays
                             # jobs scheduled exactly on the hour)
  push:
    branches: [main]
    paths:
      - 'pizza/**'
      - 'odyssey-seats/**'
      - 'scripts/**'
      - 'sites.config.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build sites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # to commit weekly ranking snapshots
      pages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Python dependencies
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium

      # Builds each site into dist/<slug>/, runs its verifier, promotes its
      # entry page, then renders the landing page. If any site fails, the run
      # fails and nothing is deployed -- the previous deploy stays live rather
      # than a half-built site going out.
      - name: Build all sites
        run: node scripts/build-all.mjs

      - name: Record weekly snapshots
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain '*/data/history.json')" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*/data/history.json'
            git commit -m "chore: weekly site snapshots $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No snapshot movement to record."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
