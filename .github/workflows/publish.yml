name: Publish sites

# Builds every site in sites.config.json and deploys dist/ to GitHub Pages.
#
# One workflow deploys everything on purpose: a Pages deployment replaces the
# whole site, so separate per-site workflows would delete each other's output.
# The cron therefore runs at the fastest cadence any single site needs.
on:
  schedule:
    - cron: '17 13 * * *'    # daily at 13:17 UTC (06:17 Pacific), offset from
                             # :00 (GitHub delays jobs scheduled on the hour)
  push:
    branches: [main]
    paths:
      - 'pizza/**'
      - 'odyssey-seats/**'
      - 'clock/**'
      - 'scripts/**'
      - 'sites.config.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build sites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # to commit weekly ranking snapshots
      pages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Python dependencies
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium

      # Data refresh runs before the build and only writes into */data/.
      # Fail-soft: no network or a bad response leaves the existing data in
      # place and the build still publishes.
      - name: Unit tests
        run: node --test pizza/test/*.test.mjs

      - name: Refresh Seattle pizza buzz
        run: node pizza/scripts/fetch-buzz.mjs

      # Fills lat/lon for any address that lacks them (one Nominatim request
      # per second, cached into the dataset, so each address geocodes once,
      # ever). Fail-soft: an address that will not geocode is skipped and the
      # map renders without that marker.
      - name: Geocode new addresses
        run: node pizza/scripts/geocode.mjs || echo "::warning::geocoding skipped"

      # Builds each site into dist/<slug>/, runs its verifier, promotes its
      # entry page, then renders the landing page. If any site fails, the run
      # fails and nothing is deployed -- the previous deploy stays live rather
      # than a half-built site going out.
      - name: Build all sites
        run: node scripts/build-all.mjs

      # Persist refreshed data so tomorrow's run can diff against it -- that is
      # what makes the buzz list accumulate and the ▲/▼ markers meaningful.
      - name: Commit refreshed data
        if: github.ref == 'refs/heads/main'
        run: |
          PATHS="pizza/data/history.json pizza/data/buzz.json pizza/data/restaurants.json"
          if [ -n "$(git status --porcelain -- $PATHS)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $PATHS
            git commit -m "chore(data): daily refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No data changes to record."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
