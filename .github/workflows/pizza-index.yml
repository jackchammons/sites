name: Seattle Pizza Index

# Rebuilds the SLICE rankings and redeploys the site to GitHub Pages.
#  - every Monday at 13:00 UTC (06:00 Pacific)
#  - on any push that touches the data, the algorithm or this workflow
#  - on demand from the Actions tab
on:
  schedule:
    - cron: '0 13 * * 1'
  push:
    branches: [main]
    paths:
      - 'pizza/**'
      - '.github/workflows/pizza-index.yml'
  workflow_dispatch:

# Allow one deployment at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build rankings
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the weekly ranking snapshot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the site
        run: node pizza/scripts/build.mjs

      - name: Verify the build
        run: node pizza/scripts/verify.mjs

      - name: Record this week's snapshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain pizza/data/history.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pizza/data/history.json
            git commit -m "chore(pizza): weekly ranking snapshot $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No ranking movement to record."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
